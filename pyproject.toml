# this_file: pyproject.toml
[project]
name = "typekit2"
dynamic = ["version"]
description = "Modern Python client and CLI for the Adobe Fonts (Typekit) API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Suchan Lee", email = "lee.suchan@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "python-dotenv>=1.2.3",
    "requests>=2.32.5",
]
keywords = ["adobe-fonts", "typekit", "api", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://fonts.adobe.com/docs/api"
Repository = "https://github.com/fontlaborg/typekit-python"

[project.scripts]
typekit2 = "typekit2.__main__:main"

[build-system]
requires = ["hatchling>=1.32", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "typekit2/__version__.py"
template = '''# this_file: typekit2/__version__.py
# Generated by hatch-vcs. Do not edit or commit.
__version__ = version = {version!r}
'''

[tool.hatch.build.targets.wheel]
packages = ["typekit2"]

[tool.hatch.build.targets.sdist]
include = [
    "typekit2",
    "tests",
    "docs",
    "*.md",
    "*.toml",
    "*.lock",
    "*.sh",
    "LICENSE",
    ".env.example",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=typekit2 --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["typekit2/__version__.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
